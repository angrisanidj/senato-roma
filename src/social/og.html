<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{position:relative;background:#4A1119;background-image:radial-gradient(120% 140% at 15% 0%,#6E1A26 0%,#4A1119 55%,#360C12 100%);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.medal{position:absolute;right:64px;top:50%;width:380px;height:470px;margin-top:-242px;border-radius:50%;overflow:hidden;
  border:6px solid #C99A3A;box-shadow:0 0 0 2px #7A5A1E,0 0 0 14px rgba(201,154,58,.18),0 18px 40px rgba(0,0,0,.45);background:#2A080D}
.medal img{position:absolute;left:50%;top:2px;width:372px;margin-left:-186px;filter:sepia(.45) saturate(1.05) contrast(1.06)}
.txt{position:absolute;left:72px;top:64px;width:640px}
.kick{font-family:'Cinzel',Georgia,serif;font-weight:600;font-size:22px;letter-spacing:.22em;color:#D4AE55;text-transform:uppercase}
h1{font-family:'Cinzel',Georgia,serif;font-weight:700;font-size:74px;line-height:1.06;letter-spacing:.02em;color:#F1D99A;margin:22px 0 26px;text-shadow:0 2px 0 #2A080D}
p{font-size:28px;line-height:1.36;color:#E8D6C2;margin:0;max-width:640px}
.hemi{position:absolute;left:66px;bottom:36px}
.band{position:absolute;left:0;right:0;bottom:0;height:14px;background:#C99A3A;box-shadow:inset 0 2px 0 #7A5A1E}
</style></head><body>
<div class="medal"><img src="{{CAES}}" alt=""></div>
<div class="txt">
  <div class="kick">Infografica · 79–27 a.C.</div>
  <h1>Il Senato da Silla ad Augusto</h1>
  <p>Come si spostarono i senatori in 25 sedute, dalla dittatura di Silla al principato.</p>
</div>
<svg class="hemi" width="220" height="100" viewBox="0 0 220 100">{{HEMI}}</svg>
<div class="band"></div>
</body></html>
