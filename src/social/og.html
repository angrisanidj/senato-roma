<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{position:relative;background:#22070B;background-image:radial-gradient(95% 130% at 12% 0%,#7E2230 0%,#4A1119 42%,#1E060A 100%);font-family:'EB Garamond',Georgia,serif}
.glow{position:absolute;inset:0;background:radial-gradient(48% 70% at 80% 48%,rgba(212,174,85,.22),transparent 70%),radial-gradient(140% 90% at 50% 125%,rgba(0,0,0,.6),transparent 60%)}
.art{position:absolute;right:20px;top:-30px;height:760px;mix-blend-mode:luminosity}
.art img{height:100%;filter:contrast(1.25) brightness(1.08);-webkit-mask-image:radial-gradient(52% 58% at 56% 40%,#000 34%,rgba(0,0,0,.5) 60%,transparent 78%);mask-image:radial-gradient(52% 58% at 56% 40%,#000 34%,rgba(0,0,0,.5) 60%,transparent 78%)}
.txt{position:absolute;left:72px;top:50px;width:700px}
.kick{display:flex;align-items:center;gap:16px;font-family:'Cinzel',Georgia,serif;font-weight:600;font-size:18px;letter-spacing:.26em;color:#D4AE55;text-transform:uppercase}
.kick:after{content:"";width:110px;height:1px;background:linear-gradient(90deg,#D4AE55,transparent)}
h1{font-family:'Cinzel',Georgia,serif;font-weight:700;font-size:66px;line-height:1.02;letter-spacing:.01em;margin:16px 0 16px;background:linear-gradient(180deg,#FFF3CF 0%,#F0D38A 42%,#C9973E 78%,#A87B2A 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(30,6,10,.85))}
p{font-size:27px;line-height:1.3;color:#EBDCC8;margin:0;max-width:640px}
.facts{display:flex;margin-top:22px}
.facts div{display:flex;flex-direction:column;padding:0 28px;border-left:1px solid rgba(212,174,85,.4)}
.facts div:first-child{padding-left:0;border-left:0}
.facts b{font-family:'Cinzel',Georgia,serif;font-weight:700;font-size:36px;line-height:1.05;color:#F1D99A}
.facts b em{font-style:normal;color:#C99A3A;font-size:.8em;margin:0 .12em}
.facts span{font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#C8B49A;margin-top:6px}
.strip{position:absolute;left:72px;right:72px;bottom:30px;height:34px;display:flex;gap:4px}
.strip div{flex:1;display:flex;flex-direction:column-reverse;border-radius:3px;overflow:hidden;opacity:.92}
.strip i{display:block}
.slab{position:absolute;left:72px;bottom:72px;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#C8B49A}
.slab b{color:#F1D99A;font-weight:600}
.band{position:absolute;left:0;right:0;bottom:0;height:12px;background:#C99A3A;box-shadow:inset 0 2px 0 #7A5A1E}
</style></head><body>
<div class="glow"></div>
<div class="art"><img src="{{AUG}}" alt=""></div>
<div class="txt">
  <div class="kick">Infografica · 79–27 a.C.</div>
  <h1>Il Senato da Silla ad Augusto</h1>
  <p>Come si spostarono i senatori in 25 sedute, dalla dittatura di Silla al principato.</p>
  <div class="facts"><div><b>25</b><span>sedute</span></div><div><b>52</b><span>anni di crisi</span></div><div><b>600<em>→</em>1.000+</b><span>senatori in aula</span></div></div>
</div>
<div class="slab"><b>L'aula seduta per seduta</b> · dal 79 al 27 a.C.</div>
<div class="strip">{{STRIP}}</div>
<div class="band"></div>
</body></html>
