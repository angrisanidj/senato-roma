<!-- Pulsanti di condivisione: colonna fissa a sinistra su desktop, barra in basso su mobile -->
<style>
#fg-share{position:fixed;z-index:50;display:flex;gap:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
#fg-share a,#fg-share button{box-sizing:border-box;width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:50%;border:1px solid #9A9184;background:#fff;color:#4A4038;cursor:pointer;padding:0;transition:color .15s,border-color .15s,background .15s}
#fg-share a:hover,#fg-share button:hover,#fg-share a:focus-visible,#fg-share button:focus-visible{color:#7A1F2B;border-color:#7A1F2B;background:#F5F1E8;outline:none}
#fg-share svg{width:19px;height:19px;fill:currentColor}
#fg-share .fg-sh-st{fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
#fg-share-ok{position:absolute;white-space:nowrap;font-size:13px;font-weight:600;color:#fff;background:#2B2420;padding:6px 10px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s}
#fg-share-ok.on{opacity:1}
@media (min-width:980px){
  #fg-share{flex-direction:column;top:50%;transform:translateY(-50%);left:calc(50% - 400px - 84px)}
  #fg-share-ok{left:54px;bottom:8px}
}
@media (max-width:979px){
  #fg-share{left:0;right:0;bottom:0;justify-content:center;gap:8px;padding:9px 10px calc(9px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.96);border-top:1px solid #D8CCB6;box-shadow:0 -4px 14px rgba(43,36,32,.08)}
  #fg-share a,#fg-share button{width:min(40px,calc((100vw - 68px) / 7));height:auto;aspect-ratio:1}
  #fg-share svg{width:min(17px,calc((100vw - 68px) / 16.5));height:auto;aspect-ratio:1}
  #fg-share-ok{bottom:calc(100% + 8px);left:50%;transform:translateX(-50%)}
  body{padding-bottom:calc(62px + env(safe-area-inset-bottom,0px))}
}
@media print{#fg-share{display:none}}
</style>

<script>
(function(){
  // SHARE_V entra nell'indirizzo condiviso: va aumentato ogni volta che si cambia og-image.png,
  // cosi' X, Facebook e gli altri rileggono la pagina e mostrano l'anteprima nuova invece di quella in cache.
  var SHARE_V='2';
  var url='https://angrisanidj.github.io/senato-roma/?v='+SHARE_V;
  var text='Il Senato da Silla ad Augusto: come si spostarono i senatori tra il 79 e il 27 a.C., in 25 sedute';
  var u=encodeURIComponent(url),t=encodeURIComponent(text);
  var href={
    x:'https://x.com/intent/post?text='+t+'&url='+u,
    threads:'https://www.threads.net/intent/post?text='+t+'%20'+u,
    facebook:'https://www.facebook.com/sharer/sharer.php?u='+u,
    linkedin:'https://www.linkedin.com/sharing/share-offsite/?url='+u,
    telegram:'https://t.me/share/url?url='+u+'&text='+t,
    whatsapp:'https://wa.me/?text='+t+'%20'+u
  };
  var nav=document.getElementById('fg-share'),ok=document.getElementById('fg-share-ok'),timer;
  Array.prototype.forEach.call(nav.querySelectorAll('a[data-net]'),function(a){a.href=href[a.getAttribute('data-net')]});
  function done(msg){ok.textContent=msg;ok.classList.add('on');clearTimeout(timer);timer=setTimeout(function(){ok.classList.remove('on')},1800)}
  function legacy(){var i=document.createElement('textarea'),r=false;i.value=url;i.setAttribute('readonly','');i.style.position='fixed';i.style.opacity='0';document.body.appendChild(i);i.select();try{r=document.execCommand('copy')}catch(e){}document.body.removeChild(i);done(r?'Link copiato':url)}
  nav.querySelector('[data-net="copy"]').addEventListener('click',function(){
    if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(url).then(function(){done('Link copiato')},legacy)}else{legacy()}
  });
})();
</script>
